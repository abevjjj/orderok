<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>购物记录离线录入</title>
<style>
:root{
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;--card:#1e2235;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.15);
  --text:#e8eaf0;--text2:rgba(255,255,255,.6);--text3:rgba(255,255,255,.35);
  --blue:#4f8ef7;--green:#3dd68c;--red:#ff6b6b;--orange:#ffaa44;--purple:#a78bfa;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.topbar h1{font-size:16px;font-weight:700;flex:1}
.topbar .badge{font-size:12px;color:var(--orange)}
.content{padding:16px;max-width:640px;margin:0 auto}
.tabs{display:flex;background:var(--bg3);border-radius:10px;padding:3px;margin-bottom:16px}
.tab{flex:1;padding:9px;text-align:center;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-radius:8px;transition:.2s}
.tab.active{background:var(--blue);color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.card-header{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.card-body{padding:16px}
.form-group{margin-bottom:13px}
.form-label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:500}
.req{color:var(--red);margin-left:2px}
.form-input,.form-select,.form-textarea{width:100%;padding:11px 14px;background:var(--bg3);border:1px solid var(--border2);
  border-radius:10px;color:var(--text);font-size:15px;outline:none;transition:.2s;appearance:none;-webkit-appearance:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--blue)}
.form-textarea{resize:vertical;min-height:72px;font-family:monospace;font-size:13px}
.input-row{display:flex;gap:8px}
.input-row .form-input{flex:1;min-width:0}
.paste-btn{padding:11px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;
           color:var(--text2);font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;
     border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--blue),#7b5ea7);color:#fff;width:100%}
.btn-ghost{background:var(--bg3);border:1px solid var(--border2);color:var(--text2)}
.btn-danger{background:linear-gradient(135deg,var(--red),#cc4444);color:#fff}
.btn-success{background:linear-gradient(135deg,var(--green),#2ead6e);color:#fff}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn-xs{padding:5px 10px;font-size:12px;border-radius:6px}
.flex{display:flex}.gap8{gap:8px}.items-center{align-items:center}.justify-between{justify-content:space-between}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}
.text-sm{font-size:13px}.text-xs{font-size:12px}.text-muted{color:var(--text2)}
.w-full{width:100%}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-blue{background:rgba(79,142,247,.15);color:var(--blue)}
.badge-green{background:rgba(61,214,140,.15);color:var(--green)}
.badge-orange{background:rgba(255,170,68,.15);color:var(--orange)}
.badge-red{background:rgba(255,107,107,.15);color:var(--red)}
.alert{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:12px}
.alert-err{background:rgba(255,107,107,.12);border:1px solid rgba(255,107,107,.25);color:var(--red)}
.alert-ok{background:rgba(61,214,140,.12);border:1px solid rgba(61,214,140,.25);color:var(--green)}
.alert-info{background:rgba(79,142,247,.12);border:1px solid rgba(79,142,247,.25);color:var(--blue)}
.record-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.tracking-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.tracking-row .form-input{flex:1;min-width:0}
.rm-btn{width:36px;height:40px;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.2);
        border-radius:8px;color:var(--red);font-size:18px;cursor:pointer;flex-shrink:0;
        display:flex;align-items:center;justify-content:center}
.export-box{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:14px;
            margin-top:12px;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;
            max-height:200px;overflow-y:auto;color:var(--text2)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:85vh;
       overflow-y:auto;padding:20px 16px 36px;border-top:1px solid var(--border2)}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:17px;font-weight:700;margin-bottom:20px}
.empty{text-align:center;padding:40px 16px;color:var(--text3);font-size:14px}
.person-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);
             border-radius:8px;padding:6px 10px;font-size:13px;margin:4px}
.person-chip .del{color:var(--red);cursor:pointer;font-size:16px;line-height:1}
.dup-warn{display:none;margin-top:4px;padding:8px 12px;background:rgba(255,107,107,.12);
          border:1px solid rgba(255,107,107,.25);border-radius:8px;color:var(--red);font-size:12px}
</style>
</head>
<body>
<div class="topbar">
  <span style="font-size:20px">📦</span>
  <h1>购物记录离线录入</h1>
  <span class="badge" id="record-count-badge"></span>
</div>

<div class="content">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('input',this)">📝 录入</div>
    <div class="tab" onclick="switchTab('records',this)">📋 记录</div>
    <div class="tab" onclick="switchTab('export',this)">📤 导出</div>
    <div class="tab" onclick="switchTab('settings',this)">⚙️ 设置</div>
  </div>

  <!-- TAB: INPUT -->
  <div id="tab-input">
    <div class="card">
      <div class="card-header">🛒 新增购物记录
        <span id="buyer-badge" style="font-size:12px;color:var(--orange);font-weight:400;margin-left:8px"></span>
      </div>
      <div class="card-body">
        <div id="input-alert"></div>
        <div class="form-group">
          <label class="form-label">购买日期 <span class="req">*</span></label>
          <input class="form-input" id="in-date" type="date">
        </div>
        <div class="form-group">
          <label class="form-label">货品名称 <span class="req">*</span></label>
          <div class="input-row">
            <input class="form-input" id="in-goods" placeholder="请输入货品名称">
            <button class="paste-btn" onclick="pasteToField('in-goods')">📋</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">快递公司</label>
          <input class="form-input" id="in-company" placeholder="选填">
        </div>
        <div class="form-group">
          <label class="form-label">快递单号（可多条，用"；"分隔或逐条添加）</label>
          <div id="in-trackings"></div>
          <button class="btn btn-ghost btn-sm mt8" onclick="addInputTrackingRow()">＋ 添加快递单号</button>
        </div>
        <div class="form-group">
          <label class="form-label">指定收货人 <span class="req">*</span></label>
          <select class="form-select" id="in-receiver">
            <option value="">请选择收货人</option>
          </select>
        </div>
        <button class="btn btn-primary mt12" onclick="saveRecord()">💾 保存记录</button>
      </div>
    </div>
  </div>

  <!-- TAB: RECORDS -->
  <div id="tab-records" style="display:none">
    <div class="flex justify-between items-center mb8">
      <span class="text-sm text-muted" id="rec-count-label"></span>
      <button class="btn btn-danger btn-xs" onclick="clearAll()">清空全部</button>
    </div>
    <div id="records-list"></div>
  </div>

  <!-- TAB: EXPORT -->
  <div id="tab-export" style="display:none">
    <div class="card">
      <div class="card-header">📤 导出未导出记录</div>
      <div class="card-body">
        <div id="export-alert"></div>
        <p class="text-sm text-muted mb8">
          导出全部<b>未导出过</b>的记录，导出后将标记为已导出。<br>
          导出格式：<code style="color:var(--orange);font-size:12px">录入日期,购买日期,货品名称,快递公司,快递单号(多个用;),收货人</code>
        </p>
        <div class="flex gap8">
          <button class="btn btn-success w-full" onclick="doExport()">📤 导出未导出记录</button>
          <button class="btn btn-ghost" onclick="copyExport()" id="copy-btn" style="display:none">📋 复制</button>
        </div>
        <div id="export-result" style="display:none"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">📋 导出历史</div>
      <div class="card-body" style="padding:0">
        <div id="export-history"></div>
      </div>
    </div>
  </div>

  <!-- TAB: SETTINGS -->
  <div id="tab-settings" style="display:none">
    <div class="card">
      <div class="card-header">👤 购买人设置（单一）</div>
      <div class="card-body">
        <p class="text-sm text-muted mb8">录入时自动带入，无需每次选择</p>
        <div class="input-row">
          <input class="form-input" id="buyer-name-input" placeholder="输入购买人姓名">
          <button class="btn btn-primary" style="width:auto;padding:11px 20px" onclick="saveBuyer()">保存</button>
        </div>
        <div id="buyer-display" class="mt8" style="font-size:13px;color:var(--text2)"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">📋 收货人列表</div>
      <div class="card-body">
        <div class="form-group">
          <div id="persons-list"></div>
        </div>
        <div class="input-row mt8">
          <input class="form-input" id="new-person" placeholder="添加收货人姓名">
          <button class="btn btn-primary" style="width:auto;padding:11px 20px" onclick="addPerson()">添加</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">🗑️ 数据管理</div>
      <div class="card-body">
        <button class="btn btn-danger w-full mb8" onclick="clearExported()">清除已导出记录</button>
        <button class="btn btn-ghost w-full" onclick="clearHistory()">清除导出历史</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: Edit Record -->
<div class="modal-overlay" id="modal-edit">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">编辑记录</div>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label class="form-label">购买日期</label>
      <input class="form-input" id="edit-date" type="date">
    </div>
    <div class="form-group">
      <label class="form-label">货品名称</label>
      <input class="form-input" id="edit-goods">
    </div>
    <div class="form-group">
      <label class="form-label">快递公司</label>
      <input class="form-input" id="edit-company">
    </div>
    <div class="form-group">
      <label class="form-label">快递单号（多个用"；"分隔）</label>
      <input class="form-input" id="edit-tracking" placeholder="多个单号用；分隔">
    </div>
    <div class="form-group">
      <label class="form-label">指定收货人 <span class="req">*</span></label>
      <select class="form-select" id="edit-receiver"></select>
    </div>
    <div class="flex gap8 mt12">
      <button class="btn btn-ghost w-full" onclick="closeModal('modal-edit')">取消</button>
      <button class="btn btn-primary w-full" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════
// STORAGE HELPERS
// ═══════════════════════════════════
const KEYS = {records:'offline_records', persons:'offline_persons', exports:'offline_exports', buyer:'offline_buyer'};

function load(key){ try{return JSON.parse(localStorage.getItem(KEYS[key]))||[];}catch{return [];} }
function loadStr(key){ return localStorage.getItem(KEYS[key])||''; }
function save(key,val){ localStorage.setItem(KEYS[key], JSON.stringify(val)); }
function saveStr(key,val){ localStorage.setItem(KEYS[key], val); }

function getRecords(){ return load('records'); }
function getPersons(){ return load('persons'); }
function getExports(){ return load('exports'); }
function getBuyer(){ return loadStr('buyer'); }

function saveRecords(r){ save('records',r); updateBadge(); }
function savePersons(p){ save('persons',p); }
function saveExports(e){ save('exports',e); }

function updateBadge(){
  const recs = getRecords();
  const unexp = recs.filter(r=>!r.exported).length;
  document.getElementById('record-count-badge').textContent = 
    `共${recs.length}条 / 未导出${unexp}条`;
  const buyer = getBuyer();
  const badge = document.getElementById('buyer-badge');
  if(badge) badge.textContent = buyer ? `购买人：${buyer}` : '（请先在设置中填写购买人）';
}

// ═══════════════════════════════════
// TABS
// ═══════════════════════════════════
function switchTab(tab, el){
  ['input','records','export','settings'].forEach(t=>{
    document.getElementById('tab-'+t).style.display = t===tab?'':'none';
  });
  document.querySelectorAll('.tabs .tab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  if(tab==='records') renderRecords();
  if(tab==='export') renderExportHistory();
  if(tab==='settings') renderSettings();
  if(tab==='input') refreshSelects();
}

// ═══════════════════════════════════
// BUYER (single) + PERSONS (receiver list)
// ═══════════════════════════════════
function renderSettings(){
  const buyer = getBuyer();
  const inp = document.getElementById('buyer-name-input');
  if(inp) inp.value = buyer;
  const disp = document.getElementById('buyer-display');
  if(disp) disp.textContent = buyer ? `当前购买人：${buyer}` : '未设置';
  renderPersons();
}

function saveBuyer(){
  const name = document.getElementById('buyer-name-input').value.trim();
  if(!name){ alert('请输入购买人姓名'); return; }
  saveStr('buyer', name);
  renderSettings();
  updateBadge();
  alert('购买人已保存：' + name);
}

function renderPersons(){
  const persons = getPersons();
  const list = document.getElementById('persons-list');
  if(!list) return;
  list.innerHTML = persons.length
    ? persons.map(p=>`<span class="person-chip">${esc(p)}<span class="del" onclick="removePerson('${esc(p)}')">×</span></span>`).join('')
    : '<span class="text-sm text-muted">暂无，请添加收货人</span>';
}
function addPerson(){
  const inp = document.getElementById('new-person');
  const name = inp.value.trim();
  if(!name) return;
  const persons = getPersons();
  if(!persons.includes(name)){ persons.push(name); savePersons(persons); }
  inp.value='';
  renderPersons();
  refreshSelects();
}
function removePerson(name){
  const persons = getPersons().filter(p=>p!==name);
  savePersons(persons);
  renderPersons();
  refreshSelects();
}

function refreshSelects(){
  const persons = getPersons();
  // Receiver select (required)
  const optsRecv = '<option value="">请选择收货人</option>' + persons.map(p=>`<option>${esc(p)}</option>`).join('');
  ['in-receiver','edit-receiver'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){ const v=el.value; el.innerHTML=optsRecv; el.value=v; }
  });
}

// ═══════════════════════════════════
// TRACKING ROWS (INPUT FORM)
// ═══════════════════════════════════
let trCount=0;
function addInputTrackingRow(val=''){
  trCount++;
  const idx=trCount;
  const wrap=document.getElementById('in-trackings');
  const row=document.createElement('div');
  row.className='tracking-row'; row.id='itr-'+idx;
  row.innerHTML=`
    <input class="form-input" id="itr-inp-${idx}" placeholder="快递单号（选填）" value="${esc(val)}" oninput="checkDup(this,'itr-warn-${idx}')">
    <button class="paste-btn" onclick="pasteToField('itr-inp-${idx}')">📋</button>
    <button class="rm-btn" onclick="document.getElementById('itr-${idx}').remove()">×</button>
    <div class="dup-warn" id="itr-warn-${idx}">⚠️ 该单号已存在</div>`;
  wrap.appendChild(row);
}

function checkDup(inp, warnId){
  const warn=document.getElementById(warnId);
  if(!inp.value.trim()){warn.style.display='none';return;}
  const exists=isDupTracking(inp.value.trim(),null);
  warn.style.display=exists?'block':'none';
}

function isDupTracking(tn, excludeId){
  if(!tn) return false;
  return getRecords().some(r=>{
    if(excludeId && r.id===excludeId) return false;
    return (r.trackings||[]).some(t=>t===tn);
  });
}

// ═══════════════════════════════════
// SAVE RECORD
// ═══════════════════════════════════
function saveRecord(){
  const buyer = getBuyer();
  const date=document.getElementById('in-date').value;
  const goods=document.getElementById('in-goods').value.trim();
  const company=document.getElementById('in-company').value.trim();
  const receiver=document.getElementById('in-receiver').value;
  if(!buyer){ showAlert('input-alert','请先在⚙️设置中填写购买人'); return; }
  if(!date||!goods){ showAlert('input-alert','请填写购买日期和货品名称'); return; }
  if(!receiver){ showAlert('input-alert','请选择指定收货人'); return; }

  // Collect trackings
  const rows=document.querySelectorAll('#in-trackings .tracking-row');
  const trackings=[];
  let dupFound=false;
  for(const row of rows){
    const inp=row.querySelector('.form-input');
    const tn=inp?inp.value.trim():'';
    if(tn){
      if(isDupTracking(tn,null)){dupFound=true;break;}
      tn.split(/[;；]/).map(s=>s.trim()).filter(Boolean).forEach(t=>trackings.push(t));
    }
  }
  if(dupFound){ showAlert('input-alert','有快递单号已存在，请检查'); return; }

  const rec={
    id: Date.now(),
    created_at: new Date().toISOString().replace('T',' ').slice(0,19),
    buyer, purchase_date:date, goods_name:goods,
    express_company:company, receiver,
    trackings, exported:false
  };
  const recs=getRecords();
  recs.unshift(rec);
  saveRecords(recs);
  showAlert('input-alert','保存成功 ✅','ok');
  document.getElementById('in-goods').value='';
  document.getElementById('in-company').value='';
  document.getElementById('in-receiver').value='';
  document.getElementById('in-trackings').innerHTML='';
  trCount=0;
  addInputTrackingRow();
}

// ═══════════════════════════════════
// RECORDS LIST
// ═══════════════════════════════════
function renderRecords(){
  const recs=getRecords();
  document.getElementById('rec-count-label').textContent=`共 ${recs.length} 条记录`;
  const list=document.getElementById('records-list');
  list.innerHTML=recs.length?recs.map(r=>`
    <div class="record-item">
      <div class="flex justify-between items-center mb8">
        <span style="font-weight:600;font-size:14px">${esc(r.goods_name)}</span>
        <span class="badge ${r.exported?'badge-green':'badge-orange'}">${r.exported?'已导出':'未导出'}</span>
      </div>
      <div class="text-xs text-muted mb8">
        购买人：${esc(r.buyer)} | 购买日期：${r.purchase_date}<br>
        收货人：${esc(r.receiver||'-')} | 快递：${esc(r.express_company||'-')}
      </div>
      ${r.trackings&&r.trackings.length
        ?r.trackings.map(t=>`<span class="badge badge-blue" style="margin:2px">📦 ${esc(t)}</span>`).join('')
        :'<span class="badge badge-orange">无快递单号</span>'}
      <div class="flex gap8 mt8">
        <button class="btn btn-ghost btn-xs" onclick="openEdit(${r.id})">编辑</button>
        <button class="btn btn-danger btn-xs" onclick="deleteRecord(${r.id})">删除</button>
      </div>
    </div>`).join('')
    :'<div class="empty">暂无记录</div>';
}

function deleteRecord(id){
  if(!confirm('确认删除此条记录？')) return;
  const recs=getRecords().filter(r=>r.id!==id);
  saveRecords(recs);
  renderRecords();
}

function clearAll(){
  if(!confirm('确认清空全部记录？此操作不可恢复！')) return;
  saveRecords([]);
  renderRecords();
}

// ═══════════════════════════════════
// EDIT MODAL
// ═══════════════════════════════════
function openEdit(id){
  const rec=getRecords().find(r=>r.id===id);
  if(!rec) return;
  refreshSelects();
  document.getElementById('edit-id').value=id;
  document.getElementById('edit-date').value=rec.purchase_date;
  document.getElementById('edit-goods').value=rec.goods_name;
  document.getElementById('edit-company').value=rec.express_company||'';
  document.getElementById('edit-receiver').value=rec.receiver||'';
  document.getElementById('edit-tracking').value=(rec.trackings||[]).join('；');
  document.getElementById('modal-edit').classList.add('open');
}

function saveEdit(){
  const id=Number(document.getElementById('edit-id').value);
  const date=document.getElementById('edit-date').value;
  const goods=document.getElementById('edit-goods').value.trim();
  const company=document.getElementById('edit-company').value.trim();
  const receiver=document.getElementById('edit-receiver').value;
  if(!receiver){ alert('请选择指定收货人'); return; }
  const tnRaw=document.getElementById('edit-tracking').value;
  const trackings=tnRaw.split(/[;；]/).map(s=>s.trim()).filter(Boolean);
  for(const tn of trackings){
    if(isDupTracking(tn,id)){alert('快递单号已存在：'+tn);return;}
  }
  // Keep original buyer
  const orig=getRecords().find(r=>r.id===id);
  const recs=getRecords().map(r=>r.id===id?{...r,buyer:orig?.buyer||getBuyer(),
    purchase_date:date,goods_name:goods,express_company:company,receiver,trackings}:r);
  saveRecords(recs);
  closeModal('modal-edit');
  renderRecords();
}

// ═══════════════════════════════════
// EXPORT
// ═══════════════════════════════════
let lastExportText='';

function doExport(){
  const recs=getRecords().filter(r=>!r.exported);
  if(!recs.length){ showAlert('export-alert','没有未导出的记录'); return; }
  const lines=recs.map(r=>{
    const tns=(r.trackings||[]).join(';');
    return [r.created_at, r.purchase_date, r.goods_name,
            r.express_company||'', tns, r.receiver||''].join(',');
  });
  lastExportText=lines.join('\n');
  // Mark as exported
  const now=new Date().toISOString().replace('T',' ').slice(0,19);
  const ids=recs.map(r=>r.id);
  const updated=getRecords().map(r=>ids.includes(r.id)?{...r,exported:true,exported_at:now}:r);
  saveRecords(updated);
  // Save export history
  const hist=getExports();
  hist.unshift({id:Date.now(),exported_at:now,count:recs.length,data:lastExportText});
  saveExports(hist);
  // Show result
  document.getElementById('export-result').style.display='block';
  document.getElementById('export-result').innerHTML=`
    <div class="alert alert-ok mt8">✅ 已导出 ${recs.length} 条记录</div>
    <div class="export-box">${esc(lastExportText)}</div>`;
  document.getElementById('copy-btn').style.display='inline-flex';
  renderExportHistory();
  updateBadge();
}

async function copyExport(){
  try {
    await navigator.clipboard.writeText(lastExportText);
    alert('已复制到剪贴板！可粘贴到主程序批量导入');
  } catch(e) {
    prompt('请手动复制以下内容：', lastExportText);
  }
}

function renderExportHistory(){
  const hist=getExports();
  const wrap=document.getElementById('export-history');
  wrap.innerHTML=hist.length?hist.map(h=>`
    <div style="padding:12px 16px;border-bottom:1px solid var(--border)">
      <div class="flex justify-between items-center mb8">
        <span class="text-sm">${h.exported_at}</span>
        <span class="badge badge-green">${h.count}条</span>
      </div>
      <button class="btn btn-ghost btn-xs" onclick="copyHistExport(${h.id})">📋 复制数据</button>
    </div>`).join('')
    :'<div class="empty">暂无导出历史</div>';
}

async function copyHistExport(id){
  const h=getExports().find(e=>e.id===id);
  if(!h) return;
  try {
    await navigator.clipboard.writeText(h.data);
    alert('已复制到剪贴板！');
  } catch(e) {
    prompt('请手动复制以下内容：', h.data);
  }
}

function clearExported(){
  if(!confirm('确认清除所有已导出记录？')) return;
  saveRecords(getRecords().filter(r=>!r.exported));
  renderRecords();
  updateBadge();
}
function clearHistory(){
  if(!confirm('确认清除所有导出历史？')) return;
  saveExports([]);
  renderExportHistory();
}

// ═══════════════════════════════════
// UTILS
// ═══════════════════════════════════
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showAlert(id,msg,type='err'){
  const el=document.getElementById(id);
  if(!el) return;
  el.innerHTML=`<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(()=>el.innerHTML='',4000);
}
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
async function pasteToField(fieldId){
  try{
    const text=await navigator.clipboard.readText();
    const el=document.getElementById(fieldId);
    el.value=text.trim();
  }catch(e){ alert('无法读取剪贴板，请手动粘贴'); }
}

// ═══════════════════════════════════
// INIT
// ═══════════════════════════════════
function init(){
  const today=new Date().toISOString().slice(0,10);
  document.getElementById('in-date').value=today;
  refreshSelects();
  addInputTrackingRow();
  updateBadge();
}
init();
</script>
